# 文本归一化规则。改这里即可定制读法，保存后 1 秒内自动生效，无需重启服务。
#
# 注意事项：
#   - mapping / unit 是中文读法专用，只对 lang=zh 生效
#   - unit 必须紧跟数字才生效，用于避免误转独立缩写
#   - currency 按语种分组，同一种符号在不同语种读法不同；未配置的符号保持原样
#   - post 按顺序执行，Pattern 使用 Go RE2 语法，不支持前后向断言；
#     需要上下文时请用捕获组，例如 (?<!\d)5 改写为 (^|[^\d])5
#   - post 的 lang 为空表示所有语种生效，非空时只对该语种生效
#   - mapping 中纯字母 key 自动加单词边界，避免误伤单词内部
version: 1

# 词/特号 -> 读法，最先执行
mapping:
  "985": "九八五"
  "211": "二一一"
  "110": "幺幺零"
  "119": "幺幺九"
  "120": "幺二零"
  "122": "幺二二"
  "12315": "幺二三幺五"
  "12328": "幺二三二八"
  "911": "九幺幺"
  "999": "九九九"
  "112": "幺幺二"

# 单位 -> 读法，仅当前面是数字时生效
unit:
  kV: 千伏
  GW: 吉瓦
  MW: 兆瓦
  kW: 千瓦
  W: 瓦
  kWh: 千瓦时
  MWh: 兆瓦时
  GWh: 吉瓦时
  kVA: 千伏安
  MVA: 兆伏安
  GVA: 吉伏安
  VA: 伏安
  kvar: 千乏
  Mvar: 兆乏
  var: 乏
  Hz: 赫兹
  kHz: 千赫兹
  MHz: 兆赫兹
  kA: 千安
  mA: 毫安
  Ah: 安时
  kVAh: 千伏安时
  V: 伏
  Ω: 欧
  mΩ: 毫欧
  μF: 微法
  nF: 纳法
  pF: 皮法
  ℃: 摄氏度
  ℉: 华氏度
  dB: 分贝
  dBA: A计分贝
  lx: 勒克斯
  km: 千米
  cm: 厘米
  mm: 毫米
  mg: 毫克
  μg: 微克
  kg: 千克
  t: 吨
  g: 克
  mL: 毫升
  L: 升
  ms: 毫秒
  min: 分钟
  s: 秒
  h: 小时

# 货币符号读法：语种 -> 符号 -> 读法。长符号优先匹配，未配置的符号保持原样。
# 德语故意不配 $ ，与线上 regex_norm_de 行为保持一致。
currency:
  en:
    "$": dollar
    "US$": US dollar
    "€": euro
    "£": pound
    "¥": yuan
    "₹": rupee
  de:
    "€": euro
    "£": pfund
  es:
    "$": dólares
    "€": euros
    "£": libras
    "¥": yenes
  fr:
    "$": Dollar Américain
    "€": Euro
    "£": Livre Sterling
    "¥": Yuan Chinois
  it:
    "$": Dollaro Americano
    "€": Euro
    "£": Sterlina Britannica
    "¥": Yuan Cinese
  hi:
    "$": US dollar
    "₹": Indian rupee
    "€": Euro
    "£": British pound sterling
    "¥": Chinese yuan
  ar:
    "$": دولار
    "€": يورو
    "£": جنيه
    "¥": ين
    "﷼": ريال

# 电话号码：命中后整段数字按位读（0 读零、1 读幺），括号保留，+ - 空格丢弃。
# 中文 tagger 不认识「(0527)84354120」这种区号写法，会拆成 math token 读成
# 「零」「五百二十七」「八千四百三十五万四千一百二十」；mapping 里的 120
# 也会误伤号码尾数，所以号码要在引擎和词表之前先按位读。
# 正则用 Go RE2 语法；命中整段替换，从具体到宽泛排列（先长后短）。
phone:
  # 国际号码：+1-202-555-0123、+44 20 7946 0958
  - '(\+\d{1,3}(?:[-\s]\d{2,4}){2,4}(?:[^\d]|$))'
  # 国际接入码：001-202-555-0123
  - '((?:^|[^\d])00\d{1,3}(?:[-\s]\d{2,4}){2,4}(?:[^\d]|$))'
  # 手机号：13800138000、138-0013-8000、138 0013 8000、+86 138 0013 8000、0086-138-0013-8000，可带分机
  - '((?:^|[^\d])(?:\+?\s?(?:(?:00[-\s]?)?86[-\s]?)?1[3-9]\d[-\s]?\d{4}[-\s]?\d{4})(?:-\d{1,6}|转\s?\d{1,6})?(?:[^\d]|$))'
  # 热线：400-123-4567、4008-123-456、4001234567
  - '((?:^|[^\d])[48]00\d?[-\s]?\d{3,4}[-\s]?\d{3,4}(?:[^\d]|$))'
  # 固话（括号区号）：(0527)84354120、（0527）84354120-123，也覆盖 (021)12345 这类短号码
  - '([（(]\s*0\d{2,3}\s*[)）]\s*\d{5,8}(?:-\d{1,6}|转\s?\d{1,6})?(?:[^\d]|$))'
  # 固话（横线/空格分隔）：0527-84354120、0527 84354120、010-12345678-123
  - '((?:^|[^\d])0\d{2,3}[-\s]\d{7,8}(?:-\d{1,6}|转\s?\d{1,6})?(?:[^\d]|$))'
  # 区号 + 5~6 位短号码/热线：021-12345、010-95588、0755-123456（不按数量读成「一万二千三百四十五」）
  - '((?:^|[^\d])0\d{2,3}[-\s]\d{5,6}(?:[^\d]|$))'
  # 上下文短号：拨打/致电/热线/电话 等词后紧跟的 5~8 位裸号码（无区号）逐位读，
  # 如「请拨打 12345 咨询」-> 幺二三四五；而「共 12345 件」没有上下文词，仍按数量读。
  # Go 正则不支持后行断言，所以把上下文词一起纳入匹配：spellDigits 只改数字，
  # 词和标点原样保留。必须排在具体号码规则之后，避免抢读已声明的手机号/固话；
  # 也不收「咨询/垂询」这类常接数量词的词（如「咨询 12345 人次」）。
  - '((?:服务热线|客服热线|客服电话|联系电话|热线电话|拨打|致电|拨通|热线|电话)[：:]?\s*\d{5,8})(?:[^\d]|$)'
  # 尾随上下文短号：号码后面紧跟「…热线/…电话」等名词时逐位读，
  # 如「通过12351工会服务热线咨询」-> 幺二三五一工会服务热线。
  # 数字与名词之间允许夹 0~6 个非数字字符（工会服务/政务服务便民…），
  # 但量词（条/次/个/项/人/元/号…）被排除，保证「共 12345 条热线」仍按数量读。
  - '((?:^|[^\d])\d{5,8}\s*[^\d\s条次件人元名篇台家个项笔位户号期批份张只座米吨度页字]{0,6}(?:热线|客服电话|服务电话|联系电话|电话))'
  # 前导 0 的短编号/区号：0527 -> 零五二七（排除小数，且必须最后执行）
  - '((?:^|[^\d.])0\d{2,3}(?:[^\d.]|$))'

# 后置正则，按顺序执行。lang 非空时只对该语种生效（法语的 trente-cinq 不能被拆）
# WeTextProcessing 把 "50-100" 读成「五十减一百」，这里把数字间的「减」修回「至」
post:
  - name: 数字区间减号转至
    lang: zh
    pattern: '([0-9零一二三四五六七八九十百千万亿])减([0-9零一二三四五六七八九十百千万亿])'
    replace: '${1}至${2}'
  - name: 字母连字符
    lang: zh
    pattern: '([A-Za-z])-([A-Za-z])'
    replace: '${1}杠${2}'
  - name: 数字区间兜底
    lang: zh
    pattern: '([0-9])~([0-9])'
    replace: '${1}至${2}'
  - name: 去除多余空白
    pattern: '\s{2,}'
    replace: ' '
